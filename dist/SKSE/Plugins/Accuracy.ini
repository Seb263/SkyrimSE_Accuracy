; Accuracy (Localized Combat Damage) - Mod Settings

[General]
# This parameter determines the verbosity level used by the mod for logging and communication.
# Levels of verbosity:
#    0: Only errors will be logged.
#    1: Standard information will be logged.
#    2: Advanced logging will be enabled.
iVerboseMode = 1

# Skip maintenance and dependency checks on startup
bShouldIgnoreMaintenanceChecks = false

# If enabled, the mod will automatically overwrite or replace invalid script files with valid versions during initialization.
bOverwriteInvalidScripts = true

# If enabled, the mod will extract and save script source files (psc) for debugging or development purposes.
bExtractScriptSources = false

; ============================================================================
; LOCALIZED DAMAGE - GLOBAL
; ============================================================================

[LocalizedDamage:Global]
# Enable or disable localized damage system for all actors
bEnableFeatures = true

[LocalizedDamage:Global:Head]
# Physical damage multiplier for head hits (melee attacks)
fPhysicalMult = 1.25

# Ranged damage multiplier for head hits (arrows, bolts)
fRangedMult = 1.5

# Magic damage multiplier for head hits
fMagicMult = 1.0

[LocalizedDamage:Global:Torso]
# Physical damage multiplier for torso hits
fPhysicalMult = 1.0

# Ranged damage multiplier for torso hits
fRangedMult = 1.0

# Magic damage multiplier for torso hits
fMagicMult = 1.0

[LocalizedDamage:Global:Arms]
# Physical damage multiplier for arm hits
fPhysicalMult = 0.8

# Ranged damage multiplier for arm hits
fRangedMult = 0.8

# Magic damage multiplier for arm hits
fMagicMult = 1.0

[LocalizedDamage:Global:Legs]
# Physical damage multiplier for leg hits
